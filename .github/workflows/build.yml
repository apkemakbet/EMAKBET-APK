name: Build EMAKBET APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          echo "google-services.json dibuat ($(wc -c < app/google-services.json) bytes)"

      - name: Build APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/emakbet.jks
          echo "keystore dibuat ($(wc -c < $RUNNER_TEMP/emakbet.jks) bytes)"

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Pakai build-tools: $BUILD_TOOLS"
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$IN" ]; then IN=app/build/outputs/apk/release/app-release.apk; fi
          echo "Input APK: $IN"
          $BUILD_TOOLS/zipalign -v -p 4 "$IN" aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks $RUNNER_TEMP/emakbet.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out EmakBet.apk \
            aligned.apk
          $BUILD_TOOLS/apksigner verify --verbose EmakBet.apk
          echo "APK final: $(ls -lh EmakBet.apk | awk '{print $5}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmakBet.apk
          path: EmakBet.apk

      - name: Publish ke Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EmakBet.apk
          name: EmakBet ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
